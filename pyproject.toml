[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cocast"
version = "1.0.0"
description = "Copula-Conditioning from Aggregate summaries for Synthesis of Tabular data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "dataset/LICENSE.txt"]
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
evaluation = ["scikit-learn==1.7.1", "threadpoolctl>=3,<4"]
baselines = ["sdv==1.34.1", "ctgan==0.12.1", "rdt==1.20.0", "copulas==0.14.1"]
source = ["pyreadstat>=1.2,<2"]
tokenizer = ["transformers>=4.57,<6", "huggingface-hub>=0.34,<2"]

[project.scripts]
cocast = "cocast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cocast*"]

[tool.setuptools.package-data]
cocast = ["resources/*.json", "resources/*.yaml"]
